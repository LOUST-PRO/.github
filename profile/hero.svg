<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <path d="M0,0 L800,0 L800,200 L0,200 Z" fill="url(#bg)" rx="12" />
  
  <g opacity="0.1">
    <path d="M-100,50 Q100,150 400,50 T900,100" fill="none" stroke="#38BDF8" stroke-width="4" />
    <path d="M-100,150 Q200,50 500,150 T900,50" fill="none" stroke="#818CF8" stroke-width="2" />
    <path d="M-100,100 Q300,200 600,0 T900,150" fill="none" stroke="#F472B6" stroke-width="1" />
  </g>

  <g transform="translate(400, 90)" text-anchor="middle">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="900" fill="url(#text-gradient)" filter="url(#glow)">LOUST-PRO</text>
    <text y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="4">CODE THAT SURVIVES THE EDGE CASES</text>
  </g>
  
  <g transform="translate(400, 165)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="600" letter-spacing="2">
    <text>INFRASTRUCTURE | RAG SYSTEMS | AI AGENTS | MCP</text>
  </g>
</svg>
